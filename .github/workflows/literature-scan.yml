name: Literature Scan

on:
  workflow_dispatch:
  schedule:
    # Let GitHub handle daylight saving time. Scheduled jobs can start late,
    # so do not gate execution on the runner's current time.
    - cron: "17 4 * * 1"
      timezone: "America/New_York"
    # Temporary test on September 21, 2026 at 1:25 PM Eastern.
    # Remove after the test; cron expressions do not include a year.
    - cron: "25 13 21 9 *"
      timezone: "America/New_York"

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Record requested time
        id: run_clock
        run: |
          echo "requested_at=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Write Google credentials
        run: |
          printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > "$RUNNER_TEMP/google-credentials.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/google-credentials.json" >> "$GITHUB_ENV"
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}

      - name: Run literature scan
        run: python scripts/literature_scan.py scan --lookback-days 14 --send-email
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          NOTION_VERSION: "2026-03-11"
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          GOOGLE_CLOUD_LOCATION: "global"
          GOOGLE_GENAI_USE_VERTEXAI: "True"
          GEMINI_MODEL: "gemini-3.1-pro-preview"
          RUN_REQUESTED_AT_UTC: ${{ steps.run_clock.outputs.requested_at }}
          EMAIL_RECIPIENT: "yu1344@purdue.edu"
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          GMAIL_CREDENTIALS_JSON: ${{ secrets.GMAIL_CREDENTIALS_JSON }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USE_TLS: "True"
          DIGEST_RELEVANCE_THRESHOLD: "60"
          DIGEST_MAX_ARTICLES: "20"

      - name: Record completed time
        if: always()
        run: |
          completed_at=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          {
            echo "## Literature Scan Timing"
            echo ""
            echo "- Requested at: ${{ steps.run_clock.outputs.requested_at }}"
            echo "- Completed at: ${completed_at}"
            echo "- Job status: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
